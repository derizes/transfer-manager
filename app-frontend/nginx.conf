server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial for React Router
        try_files $uri $uri/ /index.html;
    }

    # Optional: Reverse proxy to avoid CORS problems in production
    # location /api/ {
    #     proxy_pass http://backend:5000/;
    # }
}