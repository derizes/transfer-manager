version: '3.8'

services:
  backend:
    build:
      context: ./app-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production

  frontend:
    build:
      context: ./app-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend